<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Controls</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="controls" aria-label="Robot controls">
    <section class="panel arm-panel" aria-labelledby="arm-title">
      <h1 id="arm-title">Robotic arm</h1>
      <div class="speed-label"><label for="arm-speed">Speed</label><output id="arm-value" for="arm-speed">30%</output></div>
      <div class="slider-area"><div class="scale" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div><input id="arm-speed" class="speed-slider" type="range" min="0" max="100" step="5" value="30" aria-label="Arm speed"><div class="ticks" aria-hidden="true"></div></div>
      <p class="shortcut"><kbd>R</kbd> Increase <span>·</span> <kbd>F</kbd> Decrease</p>
      <div class="direction-buttons"><button class="direction-button" data-part="arm" data-direction="left" aria-label="Move arm left"><span class="arrow">←</span><span>Left <kbd>A</kbd></span></button><button class="direction-button" data-part="arm" data-direction="right" aria-label="Move arm right"><span class="arrow">→</span><span>Right <kbd>D</kbd></span></button></div>
      <p class="hint">Hold to move. Release to stop.</p>
      <button class="gripper-button" id="claw-button" aria-label="Close gripper">Gripper: <strong id="claw-label">Open</strong><kbd>Space</kbd></button>
    </section>

    <section class="camera-panel" aria-labelledby="camera-title">
      <div class="camera-heading"><h2 id="camera-title">Camera</h2><span>ESP32-CAM</span></div>
      <div class="camera-view"><img id="camera-image" data-stream-url="{{ stream_url }}" alt="ESP32 camera stream"><div id="camera-message" class="camera-message" hidden><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="12" width="36" height="28" rx="5"/><path d="m15 12 3-5h12l3 5"/><circle cx="24" cy="26" r="8"/></svg><strong>Camera unavailable</strong><span>Check the ESP32 power, Wi-Fi, and IP address.</span></div></div>
      <p class="camera-status" id="camera-status" role="status">Connecting to camera…</p>
    </section>

    <section class="panel wheel-panel" aria-labelledby="wheel-title">
      <h2 id="wheel-title">Wheels</h2>
      <div class="speed-label"><label for="wheel-speed">Speed</label><output id="wheel-value" for="wheel-speed">40%</output></div>
      <div class="slider-area"><div class="scale" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div><input id="wheel-speed" class="speed-slider" type="range" min="0" max="100" step="5" value="40" aria-label="Wheel speed"><div class="ticks" aria-hidden="true"></div></div>
      <p class="shortcut"><kbd>W</kbd> Increase <span>·</span> <kbd>S</kbd> Decrease</p>
      <div class="direction-buttons"><button class="direction-button" data-part="wheel" data-direction="left" aria-label="Steer wheels left"><span class="arrow">←</span><span>Left <kbd>←</kbd></span></button><button class="direction-button" data-part="wheel" data-direction="right" aria-label="Steer wheels right"><span class="arrow">→</span><span>Right <kbd>→</kbd></span></button></div>
      <p class="hint">Hold to steer. Release to stop.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/controls.js') }}" defer></script>
</body>
</html>
