<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Controls</title>

  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #225d39;
      background: #eff5f0;
      accent-color: #339353;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #528a63;
      outline-offset: 3px;
    }

    main {
      width: min(100%, 1500px);
      margin: auto;
      padding: 3vh 2vw;
      display: grid;
      grid-template-columns: 26fr 47fr 27fr;
      grid-template-areas:
        ".   feed joints"
        "pad port joints";
      gap: 24px;
      align-items: start;
    }

    /* Camera */
    .feed { grid-area: feed; text-align: center; }
    .feed h1 { margin: 0 0 16px; font-size: 21px; }

    .screen {
      aspect-ratio: 1.73;
      position: relative;
      display: grid;
      place-items: center;
      background: #dcebe0;
      overflow: hidden;
    }

    .screen img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #dcebe0;
    }

    [hidden] { display: none !important; }

    /* Direction pad */
    .pad {
      grid-area: pad;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      align-self: start;
    }

    .drive {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #76a881;
      border-radius: 50%;
      background: #f9fcf9;
      color: #246638;
      font-size: clamp(24px, 3vw, 44px);
      touch-action: none;
      user-select: none;
    }

    .drive[data-action="forward"]  { grid-area: 1 / 2; }
    .drive[data-action="left"]     { grid-area: 2 / 1; }
    .drive[data-action="right"]    { grid-area: 2 / 3; }
    .drive[data-action="backward"] { grid-area: 3 / 2; }

    .drive.active, #grip[aria-pressed="true"] {
      background: #338951;
      color: white;
    }

    /* Bluetooth COM field */
    .port {
      grid-area: port;
      width: 82%;
      justify-self: center;
    }

    .port-row { display: flex; gap: 12px; }

    #com-port, .confirm {
      min-height: 48px;
      border: 1px solid #7dab88;
      border-radius: 9px;
    }

    #com-port {
      width: 100%;
      min-width: 0;
      padding: 0 14px;
      background: #fff;
    }

    .confirm {
      width: 54px;
      flex-shrink: 0;
      background: #cfe6d4;
      color: #235e36;
      font-size: 24px;
    }

    .port-labels {
      display: flex;
      justify-content: space-between;
      margin: 15px 0 8px;
      font-weight: 600;
      font-size: 13px;
    }

    #port-status {
      display: block;
      padding: 7px;
      border: 1px solid #e5c377;
      border-radius: 8px;
      background: #fff4de;
      color: #805a1c;
      text-align: center;
      font-size: 13px;
    }

    /* Arm and elbow */
    .joints {
      grid-area: joints;
      padding-top: 24px;
      text-align: center;
    }

    .vertical-pair {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .joint {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 34%;
    }

    .joint button, .lr-label {
      width: 100%;
      padding: 10px 4px;
      border: 1px solid #b8d5bd;
      border-radius: 7px;
      background: #e1eee3;
      color: #245d36;
      font-weight: 600;
    }

    .joint button[aria-pressed="true"] {
      background: #c9e2ce;
      border-color: #518c60;
    }

    .joint input {
      writing-mode: vertical-lr;
      direction: rtl;
      height: clamp(180px, 39vh, 360px);
      width: 36px;
      margin: 12px 0;
      cursor: pointer;
    }

    .lr-label { display: block; }
    #lr { width: 96%; margin: 20px 0; cursor: pointer; }

    #grip {
      width: clamp(78px, 8vw, 124px);
      aspect-ratio: 1;
      margin: 16px auto;
      border-radius: 50%;
      border: 1px solid #559568;
      background: #cfe6d4;
      color: #245d36;
      font-weight: 600;
      font-size: 18px;
    }

    #notice {
      min-height: 1.4em;
      text-align: center;
      color: #855821;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-areas: "feed feed" "pad joints" "port port";
        gap: 18px;
        padding: 18px 12px;
      }

      .joints { padding-top: 0; }
      .joint { width: 46%; }
      .joint input { height: 150px; }
      .pad { align-self: center; }
      .port { width: min(100%, 460px); }
    }
  </style>
</head>

<body>
  <main>
    <section class="feed">
      <h1>FEED</h1>
      <div class="screen">
        <strong id="camera-message">CONNECTING TO CAMERA…</strong>
        <img id="camera" data-url="{{ stream_url }}" alt="ESP32 camera feed" hidden>
      </div>
    </section>

    <section class="pad" aria-label="Drive controls">
      <button class="drive" data-action="forward" aria-label="Forward, W">↑</button>
      <button class="drive" data-action="left" aria-label="Left, A">←</button>
      <button class="drive" data-action="right" aria-label="Right, D">→</button>
      <button class="drive" data-action="backward" aria-label="Backward, S">↓</button>
    </section>

    <form class="port" id="port-form">
      <div class="port-row">
        <input id="com-port" aria-label="Bluetooth COM port"
               placeholder="Bluetooth COM port" autocomplete="off"
               pattern="[Cc][Oo][Mm][1-9][0-9]*" title="Example: COM5" required>
        <button class="confirm" aria-label="Save COM port">✓</button>
      </div>
      <div class="port-labels"><span>BLUETOOTH</span><span>COM PORT</span></div>
      <output id="port-status">DISCONNECTED</output>
    </form>

    <section class="joints" aria-label="Arm controls">
      <div class="vertical-pair">
        <div class="joint">
          <button type="button" data-joint="arm" aria-pressed="true"
                  title="Select arm. U raises it and J lowers it.">ARM</button>
          <input type="range" id="arm" aria-label="Arm" aria-orientation="vertical"
                 min="0" max="100" step="1" value="50">
        </div>
        <div class="joint">
          <button type="button" data-joint="elbow" aria-pressed="false"
                  title="Press I to raise the elbow and K to lower it.">ELBOW</button>
          <input type="range" id="elbow" aria-label="Elbow" aria-orientation="vertical"
                 min="0" max="100" step="1" value="50">
        </div>
      </div>

      <label class="lr-label" for="lr">L/R</label>
      <input type="range" id="lr" min="0" max="100" step="1" value="50"
             title="N moves left. M moves right.">
      <div><button id="grip" aria-pressed="false" title="Toggle grip with Space">Grip</button></div>
    </section>
  </main>

  <p id="notice" role="status"></p>

  <script>
    const byId = id => document.getElementById(id);
    const driveKeys = { KeyW: "forward", KeyA: "left", KeyD: "right", KeyS: "backward" };
    const driveButtons = [...document.querySelectorAll(".drive")];
    const jointButtons = [...document.querySelectorAll("[data-joint]")];
    const held = new Map();
    let selectedJoint = "arm";
    let direction = "stop";

    // The team's /gamepad-action route reads the "action" field.
    // Keep events in order so a release follows the corresponding press.
    let requests = Promise.resolve();

    function send(action, details = {}) {
      const body = JSON.stringify({ action, ...details });
      requests = requests.then(async () => {
        const response = await fetch("/gamepad-action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          signal: AbortSignal.timeout(2000)
        });
        if (!response.ok) throw new Error("Command rejected");
        byId("notice").textContent = "";
      }).catch(() => {
        byId("notice").textContent = "Flask could not receive the control. Check that web.py is running.";
      });
    }

    function updateDrive() {
      const active = [...held.values()];
      const next = active.length ? active[active.length - 1] : "stop";
      if (next === direction) return;
      direction = next;
      driveButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.action === direction);
      });
      send(direction);
    }

    function releaseAll() {
      held.clear();
      updateDrive();
    }

    driveButtons.forEach(button => {
      button.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        held.set(event.pointerId, button.dataset.action);
        updateDrive();
      });

      function release(event) {
        if (held.delete(event.pointerId)) updateDrive();
      }

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    function selectJoint(name) {
      selectedJoint = name;
      jointButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.joint === name));
      });
    }

    jointButtons.forEach(button => {
      button.addEventListener("click", () => selectJoint(button.dataset.joint));
    });

    for (const name of ["arm", "elbow", "lr"]) {
      const slider = byId(name);
      if (name !== "lr") {
        slider.addEventListener("focus", () => selectJoint(name));
        slider.addEventListener("pointerdown", () => selectJoint(name));
      }
      slider.addEventListener("input", () => {
        send(name, { value: Number(slider.value) });
      });
    }

    function moveSlider(name, amount) {
      if (name !== "lr") selectJoint(name);
      const slider = byId(name);
      const previous = Number(slider.value);
      slider.value = previous + amount;
      if (Number(slider.value) !== previous) {
        slider.dispatchEvent(new Event("input"));
      }
    }

    function toggleGrip() {
      const grip = byId("grip");
      const closed = grip.getAttribute("aria-pressed") !== "true";
      grip.setAttribute("aria-pressed", String(closed));
      send("grip", { value: closed ? "closed" : "open" });
    }

    byId("grip").addEventListener("click", toggleGrip);

    window.addEventListener("keydown", event => {
      if (event.target === byId("com-port") || event.isComposing ||
          event.ctrlKey || event.metaKey || event.altKey) return;

      if (driveKeys[event.code]) {
        event.preventDefault();
        if (event.repeat) return;
        held.set(event.code, driveKeys[event.code]);
        updateDrive();
        return;
      }

      switch (event.code) {
        case "KeyU": moveSlider("arm", 1); break;
        case "KeyI": moveSlider("elbow", 1); break;
        case "KeyJ": moveSlider("arm", -1); break;
        case "KeyK": moveSlider("elbow", -1); break;
        case "KeyN": moveSlider("lr", -1); break;
        case "KeyM": moveSlider("lr", 1); break;
        case "Space":
          if (!event.repeat) toggleGrip();
          break;
        default: return;
      }
      event.preventDefault();
    });

    window.addEventListener("keyup", event => {
      if (held.delete(event.code)) updateDrive();
    });
    window.addEventListener("blur", releaseAll);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) releaseAll();
    });

    const port = byId("com-port");
    const savedPort = sessionStorage.getItem("robotComPort");
    if (savedPort) {
      port.value = savedPort;
      byId("port-status").textContent = `${savedPort} · DISCONNECTED`;
    }

    byId("port-form").addEventListener("submit", event => {
      event.preventDefault();
      const name = port.value.toUpperCase();
      port.value = name;
      sessionStorage.setItem("robotComPort", name);
      byId("port-status").textContent = `${name} · DISCONNECTED`;
      port.blur();
    });

    const camera = byId("camera");
    const cameraMessage = byId("camera-message");
    let retry;

    function loadCamera() {
      clearTimeout(retry);
      const url = new URL(camera.dataset.url, location.href);
      url.searchParams.set("t", Date.now());
      camera.src = url.href;
    }

    camera.addEventListener("load", () => {
      camera.hidden = false;
      cameraMessage.hidden = true;
    });

    camera.addEventListener("error", () => {
      camera.hidden = true;
      cameraMessage.hidden = false;
      cameraMessage.textContent = "CAMERA UNAVAILABLE";
      clearTimeout(retry);
      retry = setTimeout(loadCamera, 5000);
    });

    loadCamera();
  </script>
</body>
</html>
