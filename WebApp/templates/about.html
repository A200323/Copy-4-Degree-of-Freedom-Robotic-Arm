<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles */
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
        }

        /* Main Content Container */
        main {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }

        .card h2 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* Footer Styles */
        footer {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <section class="card">
            <h2>Hello, HELP!!!!!</h2>
            <p>This is a simple, modern HTML and CSS template. It includes a responsive layout, a clean card design, and a custom styled button.</p>
            <a href="https://imgs.search.brave.com/kdUbv30TY_1dOipsMZMn2lZNq-TJWl_n0liu3kl1j7w/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/cGl4YWJheS5jb20v/cGhvdG8vMjAyMS8x/Mi8xNS8wMi8zOC9j/b3B5cmlnaHQtNjg3/MTY3Nl82NDAucG5n">
            <button type="button">Click Me!</button> </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simple Page. All rights reserved.</p>
    </footer>

</body>
</html>
